AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FormForge delivery foundation: ECR, GitHub OIDC, and least-privilege roles
  for Amazon ECS Express Mode. This stack does not create running compute.

Parameters:
  ApplicationName:
    Type: String
    Default: formforge
    AllowedPattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
    Description: Lowercase application name used for AWS resource names.

  GitHubOwner:
    Type: String
    Default: TshephangMogotsi
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
    Description: GitHub organization or account that owns the repository.

  GitHubOwnerId:
    Type: String
    Default: "58113691"
    AllowedPattern: "^[0-9]+$"
    Description: Immutable GitHub database ID of the repository owner.

  GitHubRepository:
    Type: String
    Default: FormForge
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
    Description: GitHub repository allowed to deploy to AWS.

  GitHubRepositoryId:
    Type: String
    Default: "1317925014"
    AllowedPattern: "^[0-9]+$"
    Description: Immutable GitHub database ID of the repository.

  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9._/-]+$"
    Description: Branch allowed to assume the deployment role.

  GitHubEnvironment:
    Type: String
    Default: production
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: GitHub environment allowed to deploy the production service.

  GitHubPreviewEnvironment:
    Type: String
    Default: preview
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: GitHub environment allowed to deploy pull request previews.

  PasswordResetSesIdentity:
    Type: String
    Default: ""
    Description: Verified Amazon SES email or domain identity used to send password-reset emails.

  PasswordResetFromAddress:
    Type: String
    Default: ""
    Description: Exact From address the application is allowed to use for password-reset emails.

Conditions:
  HasPasswordResetEmailConfiguration: !And
    - !Not [!Equals [!Ref PasswordResetSesIdentity, ""]]
    - !Not [!Equals [!Ref PasswordResetFromAddress, ""]]

Resources:
  ApplicationCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ApplicationName
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  ContainerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Ref ApplicationName
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Remove pull request preview images after seven days",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["pr-"],
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 3,
                "description": "Keep the twenty most recent release images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-ecs-task-execution"
      Path: /formforge/
      Description: Pulls the FormForge image, writes logs, and reads runtime secrets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadFormForgeProductionParameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRuntimeParameters
                Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/formforge/production/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-application"
      Path: /formforge/
      Description: Grants the FormForge container its narrowly scoped runtime permissions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - !If
          - HasPasswordResetEmailConfiguration
          - PolicyName: SendPasswordResetEmail
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: SendFromVerifiedIdentity
                  Effect: Allow
                  Action:
                    - ses:SendEmail
                  Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${PasswordResetSesIdentity}"
                  Condition:
                    StringEquals:
                      ses:FromAddress: !Ref PasswordResetFromAddress
          - !Ref AWS::NoValue
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  PreviewTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-preview-task-execution"
      Path: /formforge/
      Description: Pulls preview images, writes logs, and reads only preview runtime secrets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadFormForgePreviewParameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPreviewRuntimeParameters
                Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/formforge/preview/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: CloudFormation

  PreviewApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-preview-application"
      Path: /formforge/
      Description: Runs preview application tasks without production email permissions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: CloudFormation

  ExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-ecs-express-infrastructure"
      Path: /formforge/
      Description: Allows ECS Express Mode to manage its load-balancing infrastructure.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-github-deployment"
      Path: /formforge/
      Description: Allows verified main-branch GitHub Actions runs to publish and deploy FormForge.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}"
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: PublishFormForgeImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AuthenticateToEcr
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
        - PolicyName: DeployFormForgeExpressService
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageExpressService
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:CreateExpressGatewayService
                  - ecs:DescribeClusters
                  - ecs:DescribeExpressGatewayService
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServices
                  - ecs:ListServiceDeployments
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateExpressGatewayService
                Resource: "*"
              - Sid: PassTaskExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt TaskExecutionRole.Arn
              - Sid: PassExpressInfrastructureRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ExpressInfrastructureRole.Arn
              - Sid: PassApplicationTaskRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ApplicationTaskRole.Arn
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: ManagedBy
          Value: CloudFormation

  GitHubPreviewDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-github-preview"
      Path: /formforge/
      Description: Publishes and manages preview-tagged ECS services from the protected preview environment.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:${GitHubPreviewEnvironment}"
      Policies:
        - PolicyName: PublishFormForgePreviewImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AuthenticateToEcr
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushPreviewImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ContainerRepository.Arn
        - PolicyName: DeployFormForgePreviewServices
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadExpressServices
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeExpressGatewayService
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServices
                  - ecs:ListServiceDeployments
                  - ecs:ListServices
                Resource: "*"
              - Sid: CreatePreviewServices
                Effect: Allow
                Action:
                  - ecs:CreateExpressGatewayService
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Environment: preview
              - Sid: RegisterPreviewTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Sid: ManagePreviewServices
                Effect: Allow
                Action:
                  - ecs:DeleteExpressGatewayService
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateExpressGatewayService
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Environment: preview
              - Sid: PassPreviewTaskExecutionRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt PreviewTaskExecutionRole.Arn
              - Sid: PassExpressInfrastructureRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ExpressInfrastructureRole.Arn
              - Sid: PassPreviewApplicationTaskRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt PreviewApplicationTaskRole.Arn
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: preview
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  ApplicationClusterName:
    Description: ECS cluster that hosts the FormForge Express service.
    Value: !Ref ApplicationCluster

  ContainerRepositoryName:
    Description: ECR repository name used by the delivery workflow.
    Value: !Ref ContainerRepository

  ContainerRepositoryUri:
    Description: ECR repository URI used to tag release images.
    Value: !GetAtt ContainerRepository.RepositoryUri

  GitHubDeploymentRoleArn:
    Description: Role assumed by GitHub Actions through OIDC.
    Value: !GetAtt GitHubDeploymentRole.Arn

  TaskExecutionRoleArn:
    Description: ECS task execution role used by FormForge.
    Value: !GetAtt TaskExecutionRole.Arn

  ApplicationTaskRoleArn:
    Description: Runtime role assumed by the FormForge application container.
    Value: !GetAtt ApplicationTaskRole.Arn

  GitHubPreviewDeploymentRoleArn:
    Description: Role assumed by the protected GitHub preview environment.
    Value: !GetAtt GitHubPreviewDeploymentRole.Arn

  PreviewTaskExecutionRoleArn:
    Description: ECS execution role restricted to preview runtime secrets.
    Value: !GetAtt PreviewTaskExecutionRole.Arn

  PreviewApplicationTaskRoleArn:
    Description: Runtime role for preview tasks without production email access.
    Value: !GetAtt PreviewApplicationTaskRole.Arn

  ExpressInfrastructureRoleArn:
    Description: Infrastructure role used by ECS Express Mode.
    Value: !GetAtt ExpressInfrastructureRole.Arn

  MongoDbParameterName:
    Description: Expected SSM SecureString name for the production MongoDB URI.
    Value: /formforge/production/mongodb-uri

  PreviewMongoDbParameterName:
    Description: Expected SSM SecureString name for the preview MongoDB URI.
    Value: /formforge/preview/mongodb-uri
