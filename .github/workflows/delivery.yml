name: Verify and publish

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Chromium test browser
        run: npx playwright install --with-deps chromium

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

  container:
    name: Build and publish release container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Prepare immutable release names
        run: |
          echo "GHCR_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Assume the AWS delivery role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check whether the ECR release already exists
        id: ecr-release
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the verified release to Amazon ECR
        if: steps.ecr-release.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker buildx imagetools create \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$GHCR_IMAGE:$IMAGE_TAG"

  preview:
    name: Deploy pull request preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: preview
      url: ${{ steps.endpoint.outputs.url }}

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v6

      - name: Prepare preview names
        run: |
          echo "IMAGE_TAG=pr-${{ github.event.number }}-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=formforge-pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          echo "DATABASE_NAME=formforge_preview_pr_${{ github.event.number }}" >> "$GITHUB_ENV"

      - name: Assume the isolated AWS preview role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish the preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the pull request service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ vars.ECS_PREVIEW_TASK_EXECUTION_ROLE_ARN }}
          task-role-arn: ${{ vars.ECS_PREVIEW_APPLICATION_TASK_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_EXPRESS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: "4000"
          environment-variables: |
            [
              {"name":"NODE_ENV","value":"production"},
              {"name":"PORT","value":"4000"},
              {"name":"SESSION_TTL_HOURS","value":"12"},
              {"name":"PASSWORD_RESET_TTL_MINUTES","value":"30"},
              {"name":"PUBLIC_APP_ORIGIN","value":"https://preview.invalid"},
              {"name":"MONGODB_DATABASE","value":"${{ env.DATABASE_NAME }}"}
            ]
          secrets: |
            [
              {"name":"MONGODB_URI","valueFrom":"/formforge/preview/mongodb-uri"}
            ]
          cpu: "256"
          memory: "512"
          health-check-path: /api/health/ready
          min-task-count: "1"
          max-task-count: "1"
          tags: |
            [
              {"key":"Application","value":"formforge"},
              {"key":"Environment","value":"preview"},
              {"key":"PullRequest","value":"${{ github.event.number }}"},
              {"key":"ManagedBy","value":"GitHubActions"}
            ]
          mutate-tags-on-update: "true"

      - name: Normalize the preview endpoint
        id: endpoint
        env:
          RAW_ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          case "$RAW_ENDPOINT" in
            http://*|https://*) ENDPOINT="$RAW_ENDPOINT" ;;
            *) ENDPOINT="https://$RAW_ENDPOINT" ;;
          esac
          echo "url=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the preview
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: |
          curl --fail --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$ENDPOINT/api/health/ready"

      - name: Publish the preview endpoint
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: echo "Pull request preview — $ENDPOINT" >> "$GITHUB_STEP_SUMMARY"
