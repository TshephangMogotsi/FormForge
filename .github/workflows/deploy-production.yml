name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA of a previously verified main release (defaults to the selected ref)
        required: false
        type: string

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified image to ECS Express
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.endpoint.outputs.url }}

    steps:
      - name: Validate the immutable release identifier
        run: |
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') echo "release_sha must contain only lowercase hexadecimal characters"; exit 1 ;;
          esac
          if [ "${#RELEASE_SHA}" -ne 40 ]; then
            echo "release_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Assume the AWS delivery role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify the selected release exists
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: sha-${{ env.RELEASE_SHA }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" > /dev/null

      - name: Deploy the production service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: formforge-production
          cluster: ${{ vars.ECS_CLUSTER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ env.RELEASE_SHA }}
          execution-role-arn: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          task-role-arn: ${{ vars.ECS_APPLICATION_TASK_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_EXPRESS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: "4000"
          environment-variables: |
            [
              {"name":"NODE_ENV","value":"production"},
              {"name":"PORT","value":"4000"},
              {"name":"SESSION_TTL_HOURS","value":"12"},
              {"name":"PASSWORD_RESET_TTL_MINUTES","value":"30"},
              {"name":"PUBLIC_APP_ORIGIN","value":"${{ vars.PUBLIC_APP_ORIGIN }}"}
            ]
          secrets: |
            [
              {"name":"MONGODB_URI","valueFrom":"/formforge/production/mongodb-uri"},
              {"name":"PASSWORD_RESET_FROM_EMAIL","valueFrom":"/formforge/production/password-reset-from-email"}
            ]
          cpu: "256"
          memory: "512"
          health-check-path: /api/health/ready
          min-task-count: "1"
          max-task-count: "2"
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: "70"
          tags: |
            [
              {"key":"Application","value":"formforge"},
              {"key":"Environment","value":"production"},
              {"key":"ManagedBy","value":"GitHubActions"}
            ]
          mutate-tags-on-update: "true"

      - name: Normalize the public endpoint
        id: endpoint
        env:
          RAW_ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          case "$RAW_ENDPOINT" in
            http://*|https://*) ENDPOINT="$RAW_ENDPOINT" ;;
            *) ENDPOINT="https://$RAW_ENDPOINT" ;;
          esac
          echo "url=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the public health endpoint
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: |
          curl --fail --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$ENDPOINT/api/health/ready"

      - name: Publish the deployment endpoint
        env:
          ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: echo "Production endpoint — $ENDPOINT (sha-$RELEASE_SHA)" >> "$GITHUB_STEP_SUMMARY"
